<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/css/style.css" rel="stylesheet">
    <link href="/script/script.py" rel="script">
<title>Nutricion y Vida Sana</title>
</head>
<body>
    <div>
        <img src="/html/images/logo.jpg" alt="logo de Ibeth">
        <h1>Historial Nutricional</h1>
    </div>
<div class="formBox">
    <form class="form">
        <div class="innerBox">
            <h2>Apertura</h2>
            <hr/>
            <label>Nombre/s</label>
            <br/>
            <input type="text" id="name"/>
            <br/>
            <label>Apellido/s</label>
            <br/>
            <input type="text" id="lastname"/>
            <br/>
            <label>Fecha de nacimiento</label>
            <br/>
            <input type="text" id="DOB"/>
            <label>Edad</label>
            <br/>
            <input type="number" id="age"/>
            <br/>
            <label>Sexo</label>
            <br/>
            <select name="Sexo" id="sex">
                <option value="" disabled selected hidden></option>
                <option value="Femenino">Femenino</option>
                <option value="Masculino">Masculino</option>
            </select>
            <br/>
            <label>Motivo de seguimiento</label>
            <br/>
            <input type="text" id="seguimiento"/>
            <br/>
            <label>Cambios implementados</label>
            <br/>
            <input type="text" id="cambios"/>
            <br/>
            <label>Barreras identificadas</label>
            <br/>
            <input type="text" id="barreras"/>
            <br/>
            <label>Avances o mejoras percibidas por el paciente</label>
            <br/>
            <input type="text" id="avances"/>
            <br/>
            <label>Ajustes realizados al plan nutricional</label>
            <br/>
            <input type="text" id="ajustes"/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Clinica</h2>
            <hr/>
            <label>Estado fisico general desde la ultima cita</label>
            <br/>
            <input type="text" id="estado"/>
            <br/>
            <label>Sintomas digestivos recientes</label>
            <br/>
            <input type="text" id="sintomas"/>
            <br/>
            <label>Cambios de energia, fuerza, apetito u otros</label>
            <br/>
            <input type="text" id="cambios"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Antropométrica</h2>
            <hr/>
            <label>Registro de peso y medidas</label>
            <br/>
            <input type="text" id="registro"/>
            <br/>
            <label>Dificultades en la medición</label>
            <br/>
            <input type="text" id="dificultades"/>
            <br/>
            <label>Retroalimentación según evaluación</label>
            <br/>
            <input type="text" id="cambios"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Dietetica</h2>
            <hr/>
            <label>Cambios de alimentacion desde la ultima cita</label>
            <br/>
            <input type="text" id="cambiosAli"/>
            <br/>
            <label>Alimentos incorporados o reducidos</label>
            <br/>
            <input type="text" id="alimentos"/>
            <br/>
            <label>Cumplimiento de recomendaciones previas</label>
            <br/>
            <input type="text" id="cumplimiento"/>
            <br/>
            <label>Porcentaje de adherencia a plan nutricional</label>
            <br/>
            <input type="text" id="adherencia"/>
            <br/>
            <label>Momento mas dificil de manejar</label>
            <br/>
            <input type="text" id="momoento"/>
            <br/>
            <label>Situaciones de afectaron la adherencia</label>
            <br/>
            <input type="text" id="situaciones"/>
            <br/>
            <label>Recuento de 24 horas/Frecuencia de consumo</label>
            <br/>
            <input type="text" id="recuento"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion de Actividad Fisica</h2>
            <hr/>
            <label>Rutina de actividad fisica</label>
            <br/>
            <input type="text" id="rutina"/>
            <br/>
            <label>dificultades para complir el ejercicio</label>
            <br/>
            <input type="text" id="dificultadesEje"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion de Habitos y Estilo de Vida</h2>
            <hr/>
            <label>Calidad del sueño</label>
            <br/>
            <input type="text" id="sueño"/>
            <br/>
            <label>Consumo actual de agua</label>
            <br/>
            <input type="text" id="agua"/>
            <br/>
            <label>Nivel de estres percibido</label>
            <br/>
            <input type="text" id="estres"/>
            <br/>
            <label>Estrategias utilixadas para manejar el estres</label>
            <br/>
            <input type="text" id="estrategias"/>
            <br/>
            <label>Influencia de emociones en la alimentacion</label>
            <br/>
            <input type="text" id="emociones"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Educacion Alimentaria y nutricional</h2>
            <hr/>
            <label>Refuerzo de puntos debiles, modificacion de metas</label>
            <br/>
            <input type="text" id="refuerzo"/>
            <br/>
        </div>
    </form>
</div>
</body>
<Footer>

</Footer>
</html>

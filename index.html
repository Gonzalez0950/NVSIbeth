<!DOCTYPE html>
<html>
<head>
        <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/style.css" rel="stylesheet">
<title>Nutricion y Vida Sana</title>
</head>
<body>
    <div>
        <img src="/logo.png" alt="logo de Ibeth">
        <h1>Historial Nutricional</h1>
    </div>
<div class="formBox">
    <form class="form">
        <div class="innerBox">
            <h2>Apertura</h2>
            <hr/>
            <label for="name">Nombre/s</label>
            <br/>
            <input type="text" id="name"/>
            <br/>
            <label for="lastname">Apellido/s</label>
            <br/>
            <input type="text" id="lastname"/>
            <br/>
            <label for="DOB">Fecha de nacimiento</label>
            <br/>
            <input type="date" id="DOB"/>
            <br/>
            <label for="sex">Sexo</label>
            <br/>
            <select name="Sexo" id="sex">
                <option value="" disabled selected hidden></option>
                <option value="Femenino" id="femenino">Femenino</option>
                <option value="Masculino" id="masculino">Masculino</option>
            </select>
            <br/>
            <label for="seguimiento">Motivo de seguimiento</label>
            <br/>
            <input type="text" id="seguimiento"/>
            <br/>
            <label for="cambios">Cambios implementados</label>
            <br/>
            <input type="text" id="cambios"/>
            <br/>
            <label for="barreras">Barreras identificadas</label>
            <br/>
            <input type="text" id="barreras"/>
            <br/>
            <label for="avances">Avances o mejoras percibidas por el paciente</label>
            <br/>
            <input type="text" id="avances"/>
            <br/>
            <label for="ajustes">Ajustes realizados al plan nutricional</label>
            <br/>
            <input type="text" id="ajustes"/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Clinica</h2>
            <hr/>
            <label for="estado">Estado fisico general desde la ultima cita</label>
            <br/>
            <input type="text" id="estado"/>
            <br/>
            <label for="sintomas">Sintomas digestivos recientes</label>
            <br/>
            <input type="text" id="sintomas"/>
            <br/>
            <label for="cambiosE">Cambios de energia, fuerza, apetito u otros</label>
            <br/>
            <input type="text" id="cambiosE"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Antropométrica</h2>
            <hr/>
            <label for="registro">Registro de peso y medidas</label>
            <br/>
            <input type="text" id="registro"/>
            <br/>
            <label for="dificultades">Dificultades en la medición</label>
            <br/>
            <input type="text" id="dificultades"/>
            <br/>
            <label for="cambiosR">Retroalimentación según evaluación</label>
            <br/>
            <input type="text" id="cambiosR"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion Dietetica</h2>
            <hr/>
            <label for="cambiosAli">Cambios de alimentacion desde la ultima cita</label>
            <br/>
            <input type="text" id="cambiosAli"/>
            <br/>
            <label for="alimentos">Alimentos incorporados o reducidos</label>
            <br/>
            <input type="text" id="alimentos"/>
            <br/>
            <label for="cumplimiento">Cumplimiento de recomendaciones previas</label>
            <br/>
            <input type="text" id="cumplimiento"/>
            <br/>
            <label for="adherencia">Porcentaje de adherencia a plan nutricional</label>
            <br/>
            <input type="text" id="adherencia"/>
            <br/>
            <label for="momento">Momento mas dificil de manejar</label>
            <br/>
            <input type="text" id="momento"/>
            <br/>
            <label for="situaciones">Situaciones de afectaron la adherencia</label>
            <br/>
            <input type="text" id="situaciones"/>
            <br/>
            <label for="recuento">Recuento de 24 horas/Frecuencia de consumo</label>
            <br/>
            <input type="text" id="recuento"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion de Actividad Fisica</h2>
            <hr/>
            <label for="rutina">Rutina de actividad fisica</label>
            <br/>
            <input type="text" id="rutina"/>
            <br/>
            <label for="dificultadesEje">dificultades para complir el ejercicio</label>
            <br/>
            <input type="text" id="dificultadesEje"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Evaluacion de Habitos y Estilo de Vida</h2>
            <hr/>
            <label for="sueño">Calidad del sueño</label>
            <br/>
            <input type="text" id="sueño"/>
            <br/>
            <label for="agua">Consumo actual de agua</label>
            <br/>
            <input type="text" id="agua"/>
            <br/>
            <label for="estres">Nivel de estres percibido</label>
            <br/>
            <input type="text" id="estres"/>
            <br/>
            <label for="estrategias">Estrategias utilizadas para manejar el estres</label>
            <br/>
            <input type="text" id="estrategias"/>
            <br/>
            <label for="emociones">Influencia de emociones en la alimentacion</label>
            <br/>
            <input type="text" id="emociones"/>
            <br/>
        </div>
        <div class="innerBox">
            <h2>Educacion Alimentaria y nutricional</h2>
            <hr/>
            <label for="refuerzo">Refuerzo de puntos debiles, modificacion de metas</label>
            <br/>
            <input type="text" id="refuerzo"/>
            <br/>
        </div>
    </form>
    <button id="submit" onclick="Completar()">Completar</button>
</div>
<div>
    <p id="myParagraph"></p>
</div>
<script src="/script.js"></script>
</body>
<Footer>

</Footer>
</html>
